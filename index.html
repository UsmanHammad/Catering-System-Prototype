<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catering Hub - Home</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="logo">Catering Hub</div>
  <ul>
    <li><a href="index.html" class="active">Home</a></li>
    <li><a href="menu.html">Menu &amp; Packages</a></li>
    <li><a href="order.html">Order</a></li>
    <li><a href="admin-login.html">Admin</a></li>
  </ul>
</nav>

<section class="hero">
  <h1>Delicious Catering for Every Occasion</h1>
  <p>Quality food and packages for your special event</p>
  <div class="btn-group">
    <a href="menu.html" class="btn btn-primary">View Menu</a>
    <a href="order.html" class="btn btn-outline">Get a Quote</a>
  </div>
</section>

<section class="section">
  <h2 class="section-title">Featured Packages</h2>
  <div class="card-grid" id="featured-packages"></div>
</section>

<footer>
  <p>Catering Hub &copy; 2026 | Contact: info@cateringhub.com | +92 300 0000000</p>
</footer>

<script src="js/api.js"></script>
<script>
  const PACKAGE_IMAGES = {
    "Bronze Package": "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=500&q=80",
    "Silver Package": "https://images.unsplash.com/photo-1555244162-803834f70033?auto=format&fit=crop&w=500&q=80",
    "Gold Package": "https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=500&q=80"
  };
  const FALLBACK_IMAGE = "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=500&q=80";

  const grid = document.getElementById("featured-packages");

  fetchPackages()
    .then(packages => {
      grid.innerHTML = packages.map(pkg => `
        <div class="card">
          <img src="${PACKAGE_IMAGES[pkg.Name] || FALLBACK_IMAGE}" alt="${pkg.Name}">
          <div class="card-body">
            <h3>${pkg.Name}</h3>
            <p>${pkg.Description}</p>
            <div class="price">$${pkg.Price}</div>
            <a href="order.html?package=${pkg.PackageID}" class="btn btn-primary">Select Package</a>
          </div>
        </div>`).join("");
    })
    .catch(err => {
      grid.innerHTML = `<p>Could not load packages. Is the server running and connected to MySQL?</p>`;
      console.error(err);
    });
</script>
</body>
</html>
