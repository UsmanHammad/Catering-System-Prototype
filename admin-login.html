<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catering Hub - Admin Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="section" style="min-height:90vh; display:flex; align-items:center; justify-content:center;">
  <form class="form-wrapper" id="login-form" style="max-width:380px;">
    <h2 style="text-align:center; margin-bottom:24px;">Admin Login</h2>

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" required>
    </div>
    <div class="form-error" id="login-error" style="display:none;">Invalid username or password.</div>

    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">Log In</button>
    <p style="text-align:center; font-size:13px; color:#888; margin-top:16px;">
      Default: admin / admin123 (change in backend/routes/admin.js)
    </p>
  </form>
</section>

<script src="js/api.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("login-error");
    try {
      await adminLogin(username, password);
      sessionStorage.setItem("isAdmin", "true");
      window.location.href = "admin.html";
    } catch (err) {
      errorEl.style.display = "block";
    }
  });
</script>
</body>
</html>
